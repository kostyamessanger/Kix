<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DropCaptcha — приостановлен</title>
<style>
:root {
  --bg: #0e0f13;
  --card: #161822;
  --text: #e6e6eb;
  --muted: #9aa0b3;
  --accent: #6cf2c2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(1200px 600px at 20% -10%, #1b1f2f, var(--bg));
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 28px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  animation: appear 0.6s ease;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6cf2c2, #5aa2ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #000;
}

.author {
  font-weight: 600;
}

.verified {
  color: var(--accent);
  font-size: 14px;
  margin-left: 4px;
}

.status {
  font-size: 14px;
  color: var(--muted);
}

h1 {
  font-size: 24px;
  margin: 16px 0 8px;
}

p {
  line-height: 1.6;
  color: #d6daf0;
}

.badge {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,193,7,0.15);
  color: #ffc107;
  font-size: 13px;
}

.actions {
  margin-top: 24px;
  display: flex;
  gap: 12px;
}

.button {
  flex: 1;
  text-align: center;
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--accent);
  color: #000;
  font-weight: 600;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.button.secondary {
  background: transparent;
  color: var(--accent);
  border: 1px solid rgba(108,242,194,0.4);
}

.button:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="avatar">K</div>
    <div>
      <div class="author">
        KIX
        <span class="verified">✔</span>
      </div>
      <div class="status">Официальное сообщение экосистемы</div>
    </div>
  </div>

  <h1>DropCaptcha временно приостановлен</h1>

  <p>
    Сервис DropCaptcha переведён в режим паузы из-за инфраструктурных
    и технических ограничений. Проект не закрыт окончательно и может
    быть возобновлён в будущем.
  </p>

  <span class="badge">⏸️ Статус: пауза</span>

  <div class="actions">
    <a class="button" href="/submit">
      Опубликовать свою статью
    </a>
    <a class="button secondary" href="/">
      Перейти в KIX
    </a>
  </div>
</div>

</body>
</html>
